<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الأعمال المزرعية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Almarai:wght@300;400;700;800&display=swap');

  :root {
    --bg:       #080c14;
    --bg2:      #0c1220;
    --bg3:      #101828;
    --surface:  #131d2e;
    --surface2: #182436;
    --border:   rgba(99,179,255,0.1);
    --border2:  rgba(99,179,255,0.2);
    --blue:     #3b82f6;
    --blue-l:   #60a5fa;
    --blue-xl:  #93c5fd;
    --cyan:     #06b6d4;
    --cyan-l:   #22d3ee;
    --gold:     #f59e0b;
    --gold-l:   #fbbf24;
    --text:     #f0f6ff;
    --text2:    #94a3b8;
    --text3:    #64748b;
    --green:    #10b981;
    --green-l:  #34d399;
    --red:      #ef4444;
    --red-l:    #f87171;
    --r-card:   20px;
    --r-lg:     28px;
    --r-sm:     12px;
    --shadow-blue: 0 0 40px rgba(59,130,246,0.15);
    --shadow-card: 0 8px 40px rgba(0,0,0,0.5);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Cairo', 'Almarai', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ══════════════════════════════════════
     LAYERED BACKGROUND SYSTEM
  ══════════════════════════════════════ */
  .bg-scene {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }

  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }

  .bg-glow1 {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
    top: -200px; right: -100px;
    animation: driftA 18s ease-in-out infinite;
  }

  .bg-glow2 {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
    bottom: -100px; left: -80px;
    animation: driftB 22s ease-in-out infinite;
  }

  .bg-glow3 {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.06) 0%, transparent 70%);
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    animation: driftC 15s ease-in-out infinite;
  }

  @keyframes driftA { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-40px,30px) scale(1.1);} }
  @keyframes driftB { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-25px) scale(1.08);} }
  @keyframes driftC { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.3);} }

  /* ══════════════════════════════════════
     SCREENS
  ══════════════════════════════════════ */
  .screen { position: relative; z-index: 1; }
  .screen.hidden { display: none !important; }

  /* ══════════════════════════════════════
     HOME SCREEN
  ══════════════════════════════════════ */
  #home-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 50px 24px 80px;
  }

  /* ─── TOP LOGO STRIP ─── */
  .home-topbar {
    width: 100%; max-width: 1100px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 64px;
    animation: slideDown .7s cubic-bezier(.22,1,.36,1) both;
  }

  .logo-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 999px;
    padding: 8px 18px 8px 12px;
  }

  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    box-shadow: 0 0 10px rgba(59,130,246,0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{box-shadow:0 0 10px rgba(59,130,246,0.6);} 50%{box-shadow:0 0 20px rgba(59,130,246,0.9);} }

  .logo-text { font-size: 0.8rem; font-weight: 700; color: var(--blue-l); letter-spacing: 1px; }

  .by-tag {
    font-size: 0.78rem; color: var(--text3); font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .by-tag span { color: var(--gold-l); }

  /* ─── HERO ─── */
  .hero {
    text-align: center;
    margin-bottom: 60px;
    animation: slideUp .9s cubic-bezier(.22,1,.36,1) .1s both;
  }

  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(6,182,212,0.08));
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.72rem; font-weight: 700; color: var(--cyan-l);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 24px;
  }

  .hero-eyebrow::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }

  .hero h1 {
    font-family: 'Almarai', 'Cairo', sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 4rem);
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #ffffff 0%, #93c5fd 40%, #22d3ee 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 4px 24px rgba(59,130,246,0.3));
  }

  .hero-sub {
    font-size: 1rem; color: var(--text2); font-weight: 400; letter-spacing: 0.5px;
  }

  /* ─── DIVIDER LINE ─── */
  .h-line {
    width: 100%; max-width: 1100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.3), rgba(6,182,212,0.3), transparent);
    margin-bottom: 40px;
    animation: slideUp .8s ease .2s both;
  }

  /* ─── CHAPTER GRID ─── */
  .chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    width: 100%; max-width: 1100px;
  }

  .chapter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 0;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease, border-color .25s;
    position: relative; overflow: hidden;
    animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both;
  }

  .chapter-card:nth-child(1){animation-delay:.05s} .chapter-card:nth-child(2){animation-delay:.1s}
  .chapter-card:nth-child(3){animation-delay:.15s} .chapter-card:nth-child(4){animation-delay:.2s}
  .chapter-card:nth-child(5){animation-delay:.25s} .chapter-card:nth-child(6){animation-delay:.3s}
  .chapter-card:nth-child(7){animation-delay:.35s} .chapter-card:nth-child(8){animation-delay:.4s}

  /* top accent stripe */
  .card-stripe {
    height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    transform: scaleX(0); transform-origin: right;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  }

  .chapter-card:hover .card-stripe { transform: scaleX(1); }

  .card-inner {
    padding: 24px 22px 22px;
  }

  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }

  .card-num-badge {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.08));
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 800; color: var(--blue-l);
    transition: all .3s;
  }

  .chapter-card:hover .card-num-badge {
    background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(6,182,212,0.15));
    border-color: rgba(59,130,246,0.5);
    box-shadow: 0 0 16px rgba(59,130,246,0.3);
  }

  .card-emoji { font-size: 1.5rem; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .chapter-card:hover .card-emoji { transform: scale(1.2) rotate(-8deg); }

  .card-title {
    font-size: 1.05rem; font-weight: 700; color: var(--text);
    margin-bottom: 14px; line-height: 1.4;
  }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
  }

  .card-start-btn {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.1));
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.78rem; font-weight: 700; color: var(--blue-l);
    transition: all .3s;
    opacity: 0; transform: translateY(4px);
  }

  .chapter-card:hover .card-start-btn {
    opacity: 1; transform: translateY(0);
    background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(6,182,212,0.15));
    border-color: rgba(59,130,246,0.4);
  }

  .card-chevron {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; color: var(--text3);
    transition: all .3s;
  }

  .chapter-card:hover {
    transform: translateY(-5px);
    border-color: rgba(59,130,246,0.35);
    box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(59,130,246,0.1), var(--shadow-blue);
  }

  .chapter-card:hover .card-chevron {
    background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.3); color: var(--blue-l);
    transform: rotate(-180deg);
  }

  .chapter-card:active { transform: translateY(-2px) scale(0.99); }

  /* ══════════════════════════════════════
     QUIZ HEADER
  ══════════════════════════════════════ */
  #quiz-screen { min-height: 100vh; display: flex; flex-direction: column; }

  .quiz-header {
    background: rgba(12,18,32,0.92);
    backdrop-filter: blur(24px) saturate(1.5);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    position: sticky; top: 0; z-index: 100;
  }

  .quiz-header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }

  .btn-back {
    display: flex; align-items: center; gap: 7px;
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.18);
    color: var(--blue-l);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 0.82rem; font-weight: 700;
    transition: all .2s;
  }
  .btn-back:hover { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.35); }

  .quiz-chapter-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }

  .quiz-counter {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.78rem; font-weight: 700; color: var(--text2);
  }

  .progress-track {
    background: rgba(255,255,255,0.06);
    border-radius: 999px; height: 5px; overflow: visible; position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    border-radius: 999px;
    transition: width .6s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    box-shadow: 0 0 14px rgba(59,130,246,0.5);
  }

  .progress-fill::after {
    content: '';
    position: absolute; left: -1px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 20px rgba(6,182,212,0.4);
    transition: left .6s cubic-bezier(.34,1.56,.64,1);
  }

  /* ══════════════════════════════════════
     QUIZ BODY
  ══════════════════════════════════════ */
  .quiz-body {
    flex: 1;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 44px 20px 80px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 0;
    width: 100%; max-width: 800px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    animation: questionIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }

  @keyframes questionIn {
    from { opacity:0; transform:translateY(28px) scale(.97); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }

  .card-top-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--cyan), var(--gold));
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .card-content { padding: 36px 40px; }

  .question-type-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(6,182,212,0.08));
    border: 1px solid rgba(59,130,246,0.22);
    color: var(--cyan-l);
    font-size: 0.72rem; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  .question-text {
    font-size: clamp(1rem, 2.2vw, 1.18rem);
    font-weight: 600;
    line-height: 1.9;
    color: var(--text);
    margin-bottom: 32px;
  }

  /* ── TRUE / FALSE ── */
  .tf-buttons {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin-bottom: 24px;
  }

  .tf-btn {
    padding: 28px 16px 22px;
    border-radius: 18px;
    border: 2px solid transparent;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  /* shimmer sweep on hover */
  .tf-btn::before {
    content: '';
    position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.08), transparent);
    transform: skewX(-20deg);
    transition: left .5s ease;
    pointer-events: none;
  }
  .tf-btn:hover:not(:disabled)::before { left: 120%; }

  .tf-icon { font-size: 2.4rem; }
  .tf-label { font-size: 1.4rem; font-weight: 900; }

  .tf-btn.true-btn {
    background: linear-gradient(145deg, rgba(16,185,129,0.1), rgba(16,185,129,0.04));
    border-color: rgba(16,185,129,0.22);
    color: var(--green-l);
  }
  .tf-btn.false-btn {
    background: linear-gradient(145deg, rgba(239,68,68,0.1), rgba(239,68,68,0.04));
    border-color: rgba(239,68,68,0.22);
    color: var(--red-l);
  }

  .tf-btn.true-btn:hover:not(:disabled) {
    background: linear-gradient(145deg, rgba(16,185,129,0.22), rgba(16,185,129,0.1));
    border-color: rgba(16,185,129,0.55);
    box-shadow: 0 10px 40px rgba(16,185,129,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    transform: translateY(-6px) scale(1.02);
  }
  .tf-btn.false-btn:hover:not(:disabled) {
    background: linear-gradient(145deg, rgba(239,68,68,0.22), rgba(239,68,68,0.1));
    border-color: rgba(239,68,68,0.55);
    box-shadow: 0 10px 40px rgba(239,68,68,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    transform: translateY(-6px) scale(1.02);
  }

  .tf-btn:active:not(:disabled) { transform: scale(.97); }
  .tf-btn:disabled { cursor: default; }

  .tf-btn.selected-correct {
    background: linear-gradient(145deg, rgba(16,185,129,0.28), rgba(16,185,129,0.14)) !important;
    border-color: var(--green) !important; color: #6ee7b7 !important;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.2), 0 12px 40px rgba(16,185,129,0.3) !important;
  }
  .tf-btn.selected-wrong {
    background: linear-gradient(145deg, rgba(239,68,68,0.28), rgba(239,68,68,0.14)) !important;
    border-color: var(--red) !important; color: #fca5a5 !important;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.2), 0 12px 40px rgba(239,68,68,0.3) !important;
  }
  .tf-btn.show-correct {
    border-color: rgba(16,185,129,0.6) !important;
    background: linear-gradient(145deg, rgba(16,185,129,0.18), rgba(16,185,129,0.08)) !important;
  }

  /* ── MCQ ── */
  .mcq-options { display: flex; flex-direction: column; gap: 11px; margin-bottom: 24px; }

  .mcq-option {
    padding: 15px 20px;
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.025);
    cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 0.98rem; font-weight: 500;
    color: var(--text);
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    display: flex; align-items: center; gap: 14px;
    position: relative; overflow: hidden;
  }

  .mcq-option::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(59,130,246,0.06), transparent);
    opacity: 0; transition: opacity .2s;
  }
  .mcq-option:hover:not(:disabled)::after { opacity: 1; }

  .opt-letter {
    width: 36px; height: 36px; flex-shrink: 0;
    background: rgba(59,130,246,0.08);
    border: 1.5px solid rgba(59,130,246,0.18);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.82rem; color: var(--blue-l);
    transition: all .25s; z-index: 1;
  }

  .mcq-option:hover:not(:disabled) {
    background: rgba(59,130,246,0.06);
    border-color: rgba(59,130,246,0.28);
    transform: translateX(-5px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .mcq-option:hover:not(:disabled) .opt-letter {
    background: rgba(59,130,246,0.18); border-color: rgba(59,130,246,0.4);
    box-shadow: 0 0 12px rgba(59,130,246,0.3);
  }
  .mcq-option:active:not(:disabled) { transform: scale(.99); }
  .mcq-option:disabled { cursor: default; }

  .mcq-option.correct {
    background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(16,185,129,0.07)) !important;
    border-color: var(--green) !important; color: #a7f3d0 !important;
    box-shadow: 0 0 0 2px rgba(16,185,129,0.15), 0 6px 24px rgba(16,185,129,0.2) !important;
  }
  .mcq-option.correct .opt-letter { background: rgba(16,185,129,0.25); border-color: var(--green); color: #6ee7b7; }

  .mcq-option.wrong {
    background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(239,68,68,0.07)) !important;
    border-color: var(--red) !important; color: #fecaca !important;
    box-shadow: 0 0 0 2px rgba(239,68,68,0.15), 0 6px 24px rgba(239,68,68,0.2) !important;
  }
  .mcq-option.wrong .opt-letter { background: rgba(239,68,68,0.25); border-color: var(--red); color: #fca5a5; }

  /* ── FEEDBACK ── */
  .feedback-box {
    border-radius: 14px; padding: 16px 20px;
    margin-bottom: 22px;
    display: none; align-items: center; gap: 14px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }

  @keyframes popIn {
    from { opacity:0; transform:scale(.93) translateY(12px); }
    to   { opacity:1; transform:scale(1)   translateY(0);    }
  }

  .feedback-box.show { display: flex; }
  .feedback-box.correct-fb {
    background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(16,185,129,0.04));
    border: 1px solid rgba(16,185,129,0.28);
  }
  .feedback-box.wrong-fb {
    background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(239,68,68,0.04));
    border: 1px solid rgba(239,68,68,0.28);
  }
  .feedback-icon { font-size: 1.8rem; flex-shrink: 0; }
  .feedback-text { font-size: 0.95rem; font-weight: 700; }
  .feedback-box.correct-fb .feedback-text { color: var(--green-l); }
  .feedback-box.wrong-fb   .feedback-text { color: var(--red-l); }

  /* ── NEXT BUTTON ── */
  .btn-next {
    display: none; width: 100%; padding: 17px;

// ============================================================
// STATE
// ============================================================
let currentChapterIdx = 0;
let currentQuestions = [];
let currentQIdx = 0;
let score = 0;
let answered = false;

// ============================================================
// BUILD HOME
// ============================================================
function buildHome() {
  const grid = document.getElementById('chapters-grid');
  grid.innerHTML = '';
  const icons = ['🌾','📊','📋','🏡','🔍','📜','📐','🎯'];
  chapters.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = 'chapter-card';
    card.innerHTML = `
      <div class="card-stripe"></div>
      <div class="card-inner">
        <div class="card-header">
          <div class="card-num-badge">0${i+1}</div>
          <div class="card-emoji">${icons[i]}</div>
        </div>
        <div class="card-title">${ch.title}</div>
        <div class="card-footer">
          <div class="card-start-btn">ابدأ الآن ←</div>
          <div class="card-chevron">↑</div>
        </div>
      </div>
    `;
    card.onclick = () => startChapter(i);
    grid.appendChild(card);
  });
}

// ============================================================
// START CHAPTER
// ============================================================
function startChapter(idx) {
  currentChapterIdx = idx;
  currentQuestions = [...chapters[idx].questions];
  currentQIdx = 0;
  score = 0;
  showScreen('quiz-screen');
  document.getElementById('quiz-title').textContent = chapters[idx].title;
  renderQuestion();
}

// ============================================================
// RENDER QUESTION
// ============================================================
function renderQuestion() {
  answered = false;
  const q = currentQuestions[currentQIdx];
  const total = currentQuestions.length;

  document.getElementById('quiz-counter').textContent = `السؤال ${currentQIdx+1} من ${total}`;
  document.getElementById('progress-bar').style.width = `${((currentQIdx)/total)*100}%`;

  const badge = document.getElementById('q-type-badge');
  badge.textContent = q.type === 'tf' ? '✓ صح أم خطأ' : '☰ اختيار من متعدد';

  document.getElementById('q-text').textContent = q.text;

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';

  if (q.type === 'tf') {
    badge.textContent = '✓ صح أم خطأ';
    opts.innerHTML = `
      <div class="tf-buttons">
        <button class="tf-btn true-btn" onclick="answerTF(true, this)">
          <span class="tf-icon">✅</span>
          <span class="tf-label">صح</span>
        </button>
        <button class="tf-btn false-btn" onclick="answerTF(false, this)">
          <span class="tf-icon">❌</span>
          <span class="tf-label">خطأ</span>
        </button>
      </div>
    `;
  } else {
    badge.textContent = '☰ اختيار من متعدد';
    const letters = ['أ','ب','ج','د'];
    q.options.forEach((opt, i) => {
      const btn = document.createElement('div');
      btn.className = 'mcq-option';
      const label = opt.startsWith('أ-') || opt.startsWith('ب-') || opt.startsWith('ج-') || opt.startsWith('د-') ? opt.slice(3).trim() : opt;
      btn.innerHTML = `<div class="opt-letter">${letters[i]}</div><div>${opt}</div>`;
      btn.onclick = function() { answerMCQ(i, this); };
      opts.appendChild(btn);
    });
  }

  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box';
  fb.innerHTML = '';

  const btnNext = document.getElementById('btn-next');
  btnNext.className = 'btn-next';
  btnNext.textContent = currentQIdx === currentQuestions.length - 1 ? '🏁 إنهاء الاختبار' : 'التالي ←';

  // re-animate card
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'questionIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both';
}

// ============================================================
// ANSWER TF
// ============================================================
function answerTF(selected, btn) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentQIdx];
  const correct = q.answer;

  document.querySelectorAll('.tf-btn').forEach(b => b.disabled = true);

  if (selected === correct) {
    btn.classList.add('selected-correct');
    score++;
    showFeedback(true);
  } else {
    btn.classList.add('selected-wrong');
    // show correct
    document.querySelectorAll('.tf-btn').forEach(b => {
      const isTrue = b.classList.contains('true-btn');
      if (isTrue === correct) b.classList.add('show-correct');
    });
    showFeedback(false);
  }

  document.getElementById('btn-next').classList.add('show');
}

// ============================================================
// ANSWER MCQ
// ============================================================
function answerMCQ(idx, btn) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentQIdx];
  const correct = q.answer;

  document.querySelectorAll('.mcq-option').forEach(b => b.onclick = null);

  if (idx === correct) {
    btn.classList.add('correct');
    score++;
    showFeedback(true);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.mcq-option')[correct].classList.add('correct');
    showFeedback(false);
  }

  document.getElementById('btn-next').classList.add('show');
}

// ============================================================
// FEEDBACK
// ============================================================
function showFeedback(isCorrect) {
  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `
    <div class="feedback-icon">${isCorrect ? '🎉' : '😔'}</div>
    <div class="feedback-text">${isCorrect ? 'إجابة صحيحة! أحسنت' : 'إجابة خاطئة! راجع الإجابة الصحيحة'}</div>
  `;
}

// ============================================================
// NEXT
// ============================================================
function nextQuestion() {
  if (currentQIdx < currentQuestions.length - 1) {
    currentQIdx++;
    renderQuestion();
  } else {
    showResults();
  }
}

// ============================================================
// RESULTS
// ============================================================
function showResults() {
  showScreen('results-screen');
  const total = currentQuestions.length;
  const wrong = total - score;
  const pct = Math.round((score / total) * 100);

  document.getElementById('result-score').textContent = `${pct}%`;
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-pct').textContent = `${pct}%`;
  document.getElementById('result-emoji').textContent =
    pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : pct >= 50 ? '👍' : '📚';

  // animate ring based on score
  const ring = document.querySelector('.result-ring');
  if (ring) {
    const deg = Math.round(pct * 3.6);
    const color1 = pct >= 70 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
    const color2 = pct >= 70 ? '#06b6d4' : pct >= 50 ? '#fbbf24' : '#f87171';
    ring.style.background = `conic-gradient(${color1} 0deg, ${color2} ${deg}deg, rgba(255,255,255,0.06) ${deg}deg)`;
  }

  document.getElementById('progress-bar').style.width = '100%';
}

function retryChapter() {
  startChapter(currentChapterIdx);
}

function goHome() {
  showScreen('home-screen');
  buildHome();
}

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0, 0);
}

// ============================================================
// INIT
// ============================================================
buildHome();
</script>
